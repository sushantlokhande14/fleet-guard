[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetguard"
version = "0.1.0"
description = "Validation platform that replays driving scenarios across software builds and triages regressions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary]>=3.1",
    "prometheus-client>=0.20",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
fleetguard = "fleetguard.cli:main"

[tool.setuptools.packages.find]
include = ["fleetguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fgsim: needs the fgsim binary (set FG_FGSIM or put it on PATH)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.setuptools.package-data]
fleetguard = ["classifiers/sql/*.sql"]
