server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve the api service through Docker's DNS at request time. With a
    # literal hostname nginx resolves it once at startup and keeps sending
    # traffic to the old container IP after `compose up` recreates the api (502s).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # API on the same origin, so the UI needs no CORS in production
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # LLM narratives on a laptop GPU can take a while
        proxy_read_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # client-side routes (/campaigns/2, /failures/86) all serve the app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
