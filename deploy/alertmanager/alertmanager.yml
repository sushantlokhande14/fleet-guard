route:
  receiver: triage
  group_by: [alertname, candidate]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: triage
      repeat_interval: 1h

receivers:
  # alerts land in the triage API (and from there in the UI), resolved ones too
  - name: triage
    webhook_configs:
      - url: http://api:8000/api/alerts/webhook
        send_resolved: true
