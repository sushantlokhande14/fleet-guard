global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # fleet KPIs read from Postgres at scrape time
  - job_name: fleet
    static_configs:
      - targets: ["exporter:9102"]

  # campaign worker process metrics
  - job_name: worker
    static_configs:
      - targets: ["worker:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
