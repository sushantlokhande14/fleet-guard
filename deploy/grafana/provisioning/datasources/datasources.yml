apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Fleet DB
    uid: fleetdb
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: fleetguard
    jsonData:
      database: fleetguard
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: fleetguard
