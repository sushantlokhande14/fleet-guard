name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: asan-ubsan
            flags: -DCMAKE_BUILD_TYPE=Debug -DFG_SANITIZE=ON
    name: core (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nlohmann-json3-dev libgtest-dev
      - name: Configure
        run: cmake -S core -B build -G Ninja ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    name: python (${{ matrix.python }})
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleetguard
          POSTGRES_PASSWORD: fleetguard
          POSTGRES_DB: fleetguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetguard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build fgsim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nlohmann-json3-dev
          cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFG_BUILD_TESTS=OFF
          cmake --build build
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check fleetguard tests tools
      - name: Test
        env:
          FG_FGSIM: build/fgsim
          FG_TEST_DATABASE_URL: postgresql://fleetguard:fleetguard@localhost:5432/fleetguard_test
        run: pytest -q

  monitoring:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dashboards match their generator
        run: |
          python3 tools/gen_dashboards.py
          git diff --exit-code deploy/grafana/dashboards
      - name: Check Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus" --entrypoint promtool \
            prom/prometheus:v2.53.1 check config /etc/prometheus/prometheus.yml
      - name: Alert rule unit tests
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p" -w /p --entrypoint promtool \
            prom/prometheus:v2.53.1 test rules alerts_test.yml

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    needs: [core, python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait api web worker
      - name: Smoke test
        run: python3 tools/e2e_smoke.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200 api worker migrate
