name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: asan-ubsan
            flags: -DCMAKE_BUILD_TYPE=Debug -DFG_SANITIZE=ON
    name: core (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nlohmann-json3-dev libgtest-dev
      - name: Configure
        run: cmake -S core -B build -G Ninja ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build fgsim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build nlohmann-json3-dev
          cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFG_BUILD_TESTS=OFF
          cmake --build build
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check fleetguard tests
      - name: Test
        env:
          FG_FGSIM: build/fgsim
        run: pytest -q
