name: fleetguard

x-app: &app
  build:
    context: .
    target: runtime
  image: fleetguard:latest
  environment:
    FG_DATABASE_URL: postgresql://fleetguard:fleetguard@db:5432/fleetguard
    # report narratives from Ollama on the host; any OpenAI-compatible endpoint works
    FG_LLM_BASE_URL: ${FG_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    FG_LLM_MODEL: ${FG_LLM_MODEL:-qwen2.5:7b}
    FG_LLM_API_KEY: ${FG_LLM_API_KEY:-}
    FG_AUTO_REPORTS_LLM: ${FG_AUTO_REPORTS_LLM:-0}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetguard
      POSTGRES_PASSWORD: fleetguard
      POSTGRES_DB: fleetguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetguard -d fleetguard"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["sh", "-c", "fleetguard db migrate && fleetguard builds sync"]
    restart: "no"

  worker:
    <<: *app
    command: ["fleetguard", "worker", "--metrics-port", "9101"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    command: ["fleetguard", "serve", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./web
    image: fleetguard-web:latest
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: fleetguard
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleetguard-overview.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - db

volumes:
  pgdata:
  promdata:
  grafanadata:
